services:
  - type: web
    name: jobbridge-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "python run.py --worker-class eventlet -w 1 --timeout 90 --graceful-timeout 30 --bind 0.0.0.0:$PORT app:app"
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      # The following must be set manually in the Render dashboard (never committed):
      # DATABASE_URL, JWT_SECRET_KEY, SECRET_KEY, SUPABASE_URL, SUPABASE_ANON_KEY,
      # SUPABASE_SERVICE_ROLE_KEY, SUPABASE_STORAGE_BUCKET, BREVO_API_KEY,
      # BREVO_SENDER_EMAIL, BREVO_SENDER_NAME, CORS_ORIGINS (set to the deployed Vercel
      # URL), FRONTEND_URL (same deployed Vercel URL, no trailing slash — used to build
      # absolute links in emails, e.g. the accreditation "Go to Dashboard" button; the
      # app refuses to boot in production without this set to a non-localhost value),
      # GOOGLE_APPLICATION_CREDENTIALS_JSON, GROQ_API_KEY, GEMINI_API_KEY,
      # ADMIN_SEED_EMAIL, ADMIN_SEED_PASSWORD
      #
      # GROQ_API_KEY: powers the AI assistant (POST /api/assistant/chat) and voice input
      # (POST /api/assistant/transcribe, no separate credential needed), created at
      # https://console.groq.com/keys. When unset both endpoints return a 503 with a
      # clear message; the rest of the app is unaffected. GROQ_MODEL and
      # GROQ_WHISPER_MODEL are optional, defaulting to qwen/qwen3.6-27b and
      # whisper-large-v3-turbo respectively. (GROQ_MODEL migrated from
      # llama-3.3-70b-versatile, which Groq deprecated 2026-08-16.)
      #
      # GOOGLE_APPLICATION_CREDENTIALS_JSON: base64-encoded contents of the Vision
      # service-account JSON key (GOOGLE_APPLICATION_CREDENTIALS, the file-path form, only
      # works in local dev — Render builds from a fresh git clone with no way to place a
      # git-ignored key file on disk). Still used by SPES/DILP/OWWA program-document
      # extraction, not by Profile Management resume extraction (see GEMINI_API_KEY
      # below). Generate the value with:
      #   PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("backend/credentials/google-vision-service-account.json"))
      #   bash:       base64 -w0 backend/credentials/google-vision-service-account.json
      #
      # GEMINI_API_KEY: powers Profile Management resume upload/extraction
      # (POST /api/profile/resume), created at https://aistudio.google.com/apikey. When
      # unset, the endpoint returns a clear extraction error; the rest of the app is
      # unaffected. GEMINI_MODEL is optional, defaulting to gemini-3.1-flash-lite.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
